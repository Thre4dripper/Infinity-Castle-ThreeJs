name: Feature request
description: Propose an improvement to Infinity Castle
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What player, contributor, or maintenance need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or result you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or different approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, seeds, or technical notes if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing request that covers this proposal.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true